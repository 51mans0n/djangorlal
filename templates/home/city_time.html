<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>City Time</title>
  <style>body { font-family: system-ui, sans-serif; padding: 24px; }</style>
</head>
<body>
  <h1>City Time</h1>
  <form method="get">
    <label>Select city:
      <select name="city" onchange="this.form.submit()">
        {% for c in choices %}
          <option value="{{ c }}" {% if c == selected %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <noscript><button type="submit">Show</button></noscript>
  </form>

  <p style="margin-top:16px;">Current time in <strong>{{ selected }}</strong>: {{ current_time }}</p>
  <p><a href="/">← Back</a></p>
</body>
</html>
