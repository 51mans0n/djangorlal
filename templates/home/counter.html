<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Counter</title>
  <style>body { font-family: system-ui, sans-serif; padding: 24px; } button { padding:8px 14px; margin-right:10px; }</style>
</head>
<body>
  <h1>Counter</h1>
  <p>Value: <strong>{{ count }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" name="inc">+1</button>
    <button type="submit" name="reset">Reset</button>
  </form>
  <p><a href="/">← Back</a></p>
</body>
</html>
