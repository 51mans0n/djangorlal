<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Users</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    .card { border:1px solid #ddd; border-radius:10px; padding:12px 16px; margin-bottom:10px; }
    a { text-decoration:none; }
  </style>
</head>
<body>
  <h1>Users</h1>
  {% for u in users %}
    <div class="card">
      <div><strong>{{ u.full_name }}</strong></div>
      <div>Age: {{ u.age }}</div>
    </div>
  {% endfor %}
  <p><a href="/">← Back</a></p>
</body>
</html>
